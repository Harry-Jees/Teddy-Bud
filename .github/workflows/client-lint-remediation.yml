name: Client lint remediation

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/App.tsx'
      - 'client/package.json'
      - 'client/package-lock.json'
      - 'scripts/extract-inline-styles.cjs'
      - '.github/workflows/client-lint-remediation.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: client-lint-remediation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  remediate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
          fetch-depth: 0
      - name: Restore complete source and reapply verified patch
        run: |
          set -euo pipefail
          git checkout 422b7137cf719b0f42e5e0142dae63f20dd3c5aa -- README.md docs/FEATURE_STATUS.md client/App.tsx client/src/services/gateway.ts client/src/services/localData.ts client/__tests__/gateway-model.test.ts
          rm -rf client/assets/stickers
          rm -f client/src/services/stickers.ts client/__tests__/stickers.test.ts
          git show 5faa5d744be9ef0244875c52a86755938efc4567:patches/teddy-bud-completion.patch > /tmp/teddy-bud-completion.patch
          git apply --binary /tmp/teddy-bud-completion.patch
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install and update compatible client dependencies
        run: npm install --no-audit --no-fund
        working-directory: client
      - name: Apply reusable style extraction
        run: node scripts/extract-inline-styles.cjs
      - name: Fix compatible dependency vulnerabilities
        continue-on-error: true
        run: npm audit fix
        working-directory: client
      - name: Report remaining dependency advisories
        continue-on-error: true
        run: |
          npm audit --json > /tmp/client-audit.json || true
          node -e "const a=require('/tmp/client-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(name+' | '+v.severity+' | direct='+v.isDirect+' | fix='+JSON.stringify(v.fixAvailable))"
        working-directory: client
      - name: Require zero lint warnings
        run: npm run lint -- --max-warnings=0
        working-directory: client
      - name: Run client tests
        run: npm test -- --runInBand
        working-directory: client
      - name: Type-check client
        run: npx tsc --noEmit
        working-directory: client
      - name: Build web client
        run: npm run build:web
        working-directory: client
      - name: Commit verified cleanup
        id: commit
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove client lint warnings and update safe dependencies"
          git push origin "HEAD:refs/heads/$PR_HEAD_REF"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch complete platform verification
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"$PR_HEAD_REF\"}"
