name: Refresh Lucide dependency lockfile

on:
  pull_request:
    branches:
      - main
    paths:
      - client/package.json
  push:
    branches:
      - fix/auth-media-icons-audit
    paths:
      - client/package.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auth-media-icons-audit
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update npm lockfile
        working-directory: client
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- client/package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/package-lock.json
          git commit -m "chore: refresh Lucide dependency lockfile"
          git push
