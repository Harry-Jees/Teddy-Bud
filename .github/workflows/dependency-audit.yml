name: Dependency security audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-audit:
    name: Audit all client dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Audit complete dependency tree
        run: npm audit --audit-level=high
      - name: Audit shipped client dependencies
        run: npm audit --omit=dev --audit-level=low

  worker-audit:
    name: Audit all gateway dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gateway-worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway-worker/package-lock.json
      - name: Audit complete gateway dependency tree
        run: npm audit --audit-level=high
      - name: Audit shipped gateway dependencies
        run: npm audit --omit=dev --audit-level=low
