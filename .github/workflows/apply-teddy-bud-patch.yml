name: Apply Teddy Bud completion patch
on:
  push:
    branches:
      - feature/emotion-web-and-guided-studio
    paths:
      - patches/teddy-bud-completion.patch
      - .github/workflows/apply-teddy-bud-patch.yml
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/emotion-web-and-guided-studio
          token: ${{ github.token }}
      - name: Apply verified source changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git apply --binary patches/teddy-bud-completion.patch
          rm -f patches/teddy-bud-completion.patch
          rmdir patches 2>/dev/null || true
          rm -f .github/workflows/apply-teddy-bud-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add contextual Teddy sticker responses"
          git push origin HEAD:refs/heads/feature/emotion-web-and-guided-studio
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -d '{"ref":"feature/emotion-web-and-guided-studio"}'
