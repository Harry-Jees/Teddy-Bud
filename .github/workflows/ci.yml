name: CI and platform builds

on:
  push:
    paths-ignore:
      - 'dist/**'
      - '.github/workflows/ci.yml'
      - 'scripts/collect_distributions.py'
      - 'scripts/verify_distributions.py'
      - '.gitattributes'
  pull_request:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Existing workflow run ID to collect artifacts from (leave blank to build all platforms)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-checks:
    if: ${{ inputs.source_run_id == '' }}
    name: Web checks and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npx tsc --noEmit
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: teddy-bud-web
          path: dist/web/
          if-no-files-found: error

  worker-tests:
    if: ${{ inputs.source_run_id == '' }}
    name: Gateway Worker tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gateway-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway-worker/package-lock.json
      - run: npm ci
      - run: npm test

  android-build:
    if: ${{ inputs.source_run_id == '' }}
    name: Android release APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: client/android/**/*.gradle*
      - run: npm ci --prefix client
      - run: bash client/android/gradlew -p client/android assembleRelease -PreactNativeArchitectures=arm64-v8a
      - name: Stage Android build in dist
        run: |
          mkdir -p dist/android
          cp client/android/app/build/outputs/apk/debug/app-debug.apk dist/android/Teddybird-V-1.0-Android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: teddy-bud-android
          path: dist/android/TeddyBud-android-debug.apk
          if-no-files-found: error

  apple-builds:
    if: ${{ inputs.source_run_id == '' }}
    name: ${{ matrix.name }} build
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        include:
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - name: Install Apple native dependencies
        working-directory: client/${{ matrix.project_dir }}
        shell: bash
        run: |
          set -o pipefail
          pod install --verbose 2>&1 | tee "$RUNNER_TEMP/pod-install.log"
      - name: Preserve CocoaPods diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cocoapods-diagnostics-${{ matrix.project_dir }}
          path: ${{ runner.temp }}/pod-install.log
          if-no-files-found: ignore
      - name: Build Apple app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${{ matrix.workspace }}" \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath "client/${{ matrix.project_dir }}/build" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-${{ matrix.project_dir }}.log"
      - name: Preserve Xcode diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-diagnostics-${{ matrix.project_dir }}
          path: ${{ runner.temp }}/xcodebuild-${{ matrix.project_dir }}.log
          if-no-files-found: ignore
      - name: Stage Apple builds in dist
        run: |
          mkdir -p "dist/${{ matrix.project_dir }}"
          ditto -c -k --sequesterRsrc --keepParent "${{ matrix.app_path }}" "dist/${{ matrix.project_dir }}/TeddyBud-${{ matrix.project_dir }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: teddy-bud-${{ matrix.project_dir }}
          path: dist/${{ matrix.project_dir }}/TeddyBud-${{ matrix.project_dir }}.zip
          if-no-files-found: error

  desktop-packages:
    if: ${{ inputs.source_run_id == '' }}
    name: Desktop package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
            command: desktop:windows
            artifact: teddy-bud-windows
          - name: macOS DMG
            os: macos-latest
            command: desktop:macos
            artifact: teddy-bud-macos-dmg
          - name: Debian package
            os: ubuntu-24.04
            command: desktop:linux
            artifact: teddy-bud-linux-deb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - name: Package desktop application
        run: npm run ${{ matrix.command }} --prefix client
        env:
          DEBUG: electron-builder
      - name: Remove unpacked Electron staging files
        run: >-
          node -e "const fs=require('node:fs');
          for (const name of ['win-unpacked','linux-unpacked','mac','mac-arm64'])
          fs.rmSync('dist/desktop/'+name,{recursive:true,force:true})"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/desktop/Teddybird-V-1.0-win-x64.exe
            dist/desktop/Teddybird-V-1.0-win-x64.exe.blockmap
            dist/desktop/Teddybird-V-1.0-mac-arm64.dmg
            dist/desktop/Teddybird-V-1.0-mac-x64.dmg
            dist/desktop/Teddybird-V-1.0-linux-x64.deb
          if-no-files-found: error

  collect-dist:
    if: ${{ always() && (inputs.source_run_id != '' || (needs.client-checks.result == 'success' && needs.worker-tests.result == 'success' && needs.android-build.result == 'success' && needs.desktop-packages.result == 'success')) }}
    name: Collect all platform builds
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    needs:
      - client-checks
      - worker-tests
      - android-build
      - desktop-packages
    steps:
      - uses: actions/checkout@v4
      - name: Clear committed distribution snapshot
        run: git rm -rf --ignore-unmatch dist/
      - name: Download build artifacts without merging
        uses: actions/download-artifact@v4
        with:
          pattern: teddy-bud-*
          path: source-artifacts
          merge-multiple: false
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Assemble platform distributions
        run: python scripts/collect_distributions.py source-artifacts dist
      - name: Verify collected distributions
        run: python scripts/verify_distributions.py
      - uses: actions/upload-artifact@v4
        with:
          name: teddy-bud-dist
          path: dist/
          if-no-files-found: error
      - name: Commit distributions to the triggering branch
        if: github.ref_type == 'branch' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install --local
          git add dist/
          if git diff --cached --quiet; then
            echo "Distribution files are already up to date."
          else
            git commit -m "chore: update compiled distributions"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
