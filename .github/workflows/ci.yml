name: CI and platform builds

on:
  push:
    paths-ignore:
      - 'dist/**'
      - '.github/workflows/ci.yml'
      - 'scripts/collect_distributions.py'
      - 'scripts/verify_distributions.py'
      - '.gitattributes'
  pull_request:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Existing workflow run ID to collect artifacts from (leave blank to build all platforms)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-checks:
    if: ${{ inputs.source_run_id == '' }}
    name: Client tests and type checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npx tsc --noEmit

  worker-tests:
    if: ${{ inputs.source_run_id == '' }}
    name: Gateway Worker tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gateway-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway-worker/package-lock.json
      - run: npm ci
      - run: npm test

  android-build:
    if: ${{ inputs.source_run_id == '' }}
    name: Android release APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: client/android/**/*.gradle*
      - run: npm ci --prefix client
      - name: Build installable Android release APK
        run: bash client/android/gradlew -p client/android assembleRelease -PreactNativeArchitectures=arm64-v8a
      - name: Stage Android release
        run: |
          mkdir -p dist/android
          cp client/android/app/build/outputs/apk/release/app-release.apk dist/android/TeddyBud.v.1.0-Android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: teddy-bud-android
          path: dist/android/TeddyBud.v.1.0-Android-arm64.apk
          if-no-files-found: error

  desktop-packages:
    if: ${{ inputs.source_run_id == '' }}
    name: Desktop package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 installer
            os: windows-latest
            command: desktop:windows
            artifact: teddy-bud-windows
            files: |
              dist/desktop/TeddyBud.v.1.0-win-x64.exe
              dist/desktop/TeddyBud.v.1.0-win-x64.exe.blockmap
          - name: macOS Intel and Apple Silicon DMGs
            os: macos-15
            command: desktop:macos
            artifact: teddy-bud-macos-dmg
            files: |
              dist/desktop/TeddyBud.v.1.0-mac-arm64.dmg
              dist/desktop/TeddyBud.v.1.0-mac-x64.dmg
          - name: Linux Debian and AppImage
            os: ubuntu-24.04
            command: desktop:linux
            artifact: teddy-bud-linux
            files: |
              dist/desktop/TeddyBud.v.1.0-linux-amd64.deb
              dist/desktop/TeddyBud.v.1.0-linux-amd64.AppImage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - name: Package desktop application
        run: npm run ${{ matrix.command }} --prefix client
        env:
          DEBUG: electron-builder
      - name: Remove unpacked Electron staging files
        run: >-
          node -e "const fs=require('node:fs');
          for (const name of ['win-unpacked','linux-unpacked','mac','mac-arm64'])
          fs.rmSync('dist/desktop/'+name,{recursive:true,force:true})"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  collect-dist:
    if: ${{ always() && (inputs.source_run_id != '' || (needs.client-checks.result == 'success' && needs.worker-tests.result == 'success' && needs.android-build.result == 'success' && needs.desktop-packages.result == 'success')) }}
    name: Collect supported platform builds
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    needs:
      - client-checks
      - worker-tests
      - android-build
      - desktop-packages
    steps:
      - uses: actions/checkout@v4
      - name: Clear committed distribution snapshot
        run: git rm -rf --ignore-unmatch dist/
      - name: Download build artifacts without merging
        uses: actions/download-artifact@v4
        with:
          pattern: teddy-bud-*
          path: source-artifacts
          merge-multiple: false
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Assemble platform distributions
        run: python scripts/collect_distributions.py source-artifacts dist
      - name: Verify collected distributions
        run: python scripts/verify_distributions.py
      - uses: actions/upload-artifact@v4
        with:
          name: teddy-bud-dist
          path: dist/
          if-no-files-found: error
      - name: Commit distributions to the triggering branch
        if: github.ref_type == 'branch' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Harry-Jees@users.noreply.github.com"
          git lfs install --local
          git add dist/
          if git diff --cached --quiet; then
            echo "Distribution files are already up to date."
          else
            git commit -m "chore: update compiled distributions"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
