name: CI and platform builds

on:
  push:
    paths-ignore:
      - 'dist/**'
  pull_request:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Existing workflow run ID to collect artifacts from (leave blank to build all platforms)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-checks:
    if: ${{ inputs.source_run_id == '' }}
    name: Client tests and type checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npx tsc --noEmit

  worker-tests:
    if: ${{ inputs.source_run_id == '' }}
    name: Gateway Worker tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gateway-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway-worker/package-lock.json
      - run: npm ci
      - run: npm test

  android-build:
    if: ${{ inputs.source_run_id == '' }}
    name: Android release APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: client/android/**/*.gradle*
      - run: npm ci --prefix client
      - name: Build installable Android release
        run: bash client/android/gradlew -p client/android assembleRelease -PreactNativeArchitectures=arm64-v8a
      - name: Stage Android release
        run: |
          set -euo pipefail
          source=client/android/app/build/outputs/apk/release/app-release.apk
          target=dist/android/TeddyBud.v.1.0-Android-arm64.apk
          test -s "$source"
          mkdir -p "$(dirname "$target")"
          cp "$source" "$target"
          test -s "$target"
      - uses: actions/upload-artifact@v4
        with:
          name: teddy-bud-android
          path: dist/android/TeddyBud.v.1.0-Android-arm64.apk
          if-no-files-found: error

  desktop-packages:
    if: ${{ inputs.source_run_id == '' }}
    name: Desktop package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 installer
            os: windows-latest
            command: desktop:windows
            artifact: teddy-bud-windows
            files: |
              dist/desktop/TeddyBud.v.1.0-win-x64.exe
              dist/desktop/TeddyBud.v.1.0-win-x64.exe.blockmap
          - name: macOS Apple Silicon DMG
            os: macos-15
            command: desktop:macos
            artifact: teddy-bud-macos-arm64
            files: |
              dist/desktop/TeddyBud.v.1.0-mac-arm64.dmg
          - name: Linux Debian and AppImage
            os: ubuntu-24.04
            command: desktop:linux
            artifact: teddy-bud-linux
            files: |
              dist/desktop/TeddyBud.v.1.0-linux-amd64.deb
              dist/desktop/TeddyBud.v.1.0-linux-amd64.AppImage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - name: Clear tracked Linux package files before rebuilding
        if: matrix.name == 'Linux Debian and AppImage'
        shell: bash
        run: |
          set -euo pipefail
          # The checkout may contain LFS pointers from the previous distribution.
          # Remove them so they cannot be mistaken for freshly generated packages.
          rm -f dist/desktop/TeddyBud.v.1.0-linux-*.deb dist/desktop/TeddyBud.v.1.0-linux-*.AppImage
      - name: Package desktop application
        run: npm run ${{ matrix.command }} --prefix client
        env:
          DEBUG: electron-builder
      - name: Normalize Linux package filenames
        if: matrix.name == 'Linux Debian and AppImage'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/desktop
          shopt -s nullglob
          debs=(dist/desktop/TeddyBud.v.1.0-linux-*.deb)
          apps=(dist/desktop/TeddyBud.v.1.0-linux-*.AppImage)
          if (( ${#debs[@]} != 1 )); then
            printf 'Expected exactly one Linux DEB, found %s: %s\n' "${#debs[@]}" "${debs[*]:-none}" >&2
            exit 1
          fi
          if (( ${#apps[@]} != 1 )); then
            printf 'Expected exactly one Linux AppImage, found %s: %s\n' "${#apps[@]}" "${apps[*]:-none}" >&2
            exit 1
          fi
          deb_target=dist/desktop/TeddyBud.v.1.0-linux-amd64.deb
          app_target=dist/desktop/TeddyBud.v.1.0-linux-amd64.AppImage
          if [[ "${debs[0]}" != "$deb_target" ]]; then mv -f "${debs[0]}" "$deb_target"; fi
          if [[ "${apps[0]}" != "$app_target" ]]; then mv -f "${apps[0]}" "$app_target"; fi
          chmod +x "$app_target"
          file dist/desktop/TeddyBud.v.1.0-linux-amd64.deb dist/desktop/TeddyBud.v.1.0-linux-amd64.AppImage
          test -s dist/desktop/TeddyBud.v.1.0-linux-amd64.deb
          test -s dist/desktop/TeddyBud.v.1.0-linux-amd64.AppImage
      - name: Remove unpacked Electron staging files
        shell: bash
        run: |
          for name in win-unpacked linux-unpacked mac mac-arm64; do
            rm -rf "dist/desktop/$name"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  collect-dist:
    if: ${{ always() && (inputs.source_run_id != '' || (needs.client-checks.result == 'success' && needs.worker-tests.result == 'success' && needs.android-build.result == 'success' && needs.desktop-packages.result == 'success')) }}
    name: Collect supported platform builds
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    needs:
      - client-checks
      - worker-tests
      - android-build
      - desktop-packages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          lfs: true
      - name: Download artifacts from the selected run
        uses: actions/download-artifact@v4
        with:
          pattern: teddy-bud-*
          path: source-artifacts
          merge-multiple: false
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Assemble fresh platform distributions
        run: |
          set -euo pipefail
          python scripts/collect_distributions.py source-artifacts dist
      - name: Verify collected distributions
        run: python scripts/verify_distributions.py
      - name: Confirm replacement set is complete
        run: |
          set -euo pipefail
          test -s dist/android/TeddyBud.v.1.0-Android-arm64.apk
          test -s dist/desktop/TeddyBud.v.1.0-win-x64.exe
          test -s dist/desktop/TeddyBud.v.1.0-win-x64.exe.blockmap
          test -s dist/desktop/TeddyBud.v.1.0-mac-arm64.dmg
          test -s dist/desktop/TeddyBud.v.1.0-linux-amd64.deb
          test -s dist/desktop/TeddyBud.v.1.0-linux-amd64.AppImage
          find dist -type f -printf '%P %s bytes\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: teddy-bud-dist
          path: dist/
          if-no-files-found: error
      # Pull-request runs verify and publish an artifact only; branch push/dispatch runs commit dist/.
      - name: Commit replaced distributions to the triggering branch
        if: github.ref_type == 'branch' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Harry-Jees@users.noreply.github.com"
          git lfs install --local
          git add -A dist/
          if git diff --cached --quiet -- dist/; then
            echo "Distribution files are already up to date."
          else
            git commit -m "chore: replace compiled distributions with verified builds"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
