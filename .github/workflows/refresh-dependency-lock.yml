name: Refresh dependency lockfile

on:
  push:
    branches:
      - overhaul/stability-cozy-ux
    paths:
      - client/package.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: overhaul/stability-cozy-ux
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
      - name: Use the repository npm version
        run: npm install --global npm@10.9.3
      - name: Refresh the client lockfile
        run: npm install --package-lock-only --ignore-scripts --prefix client
      - name: Commit the refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "chore: refresh notification dependency lockfile"
          git fetch origin overhaul/stability-cozy-ux
          git rebase origin/overhaul/stability-cozy-ux
          git push origin HEAD:overhaul/stability-cozy-ux
