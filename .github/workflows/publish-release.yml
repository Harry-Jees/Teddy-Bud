name: Publish release downloads

on:
  workflow_run:
    workflows: ["CI and platform builds"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful main CI run ID containing the teddy-bud-dist artifact"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: teddy-bud-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified packages to GitHub Releases
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve source run
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            run_id="$EVENT_RUN_ID"
          else
            run_id="$INPUT_RUN_ID"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download verified distribution artifact
        uses: actions/download-artifact@v8
        with:
          name: teddy-bud-dist
          path: release-files
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA-256 manifest
        run: |
          set -euo pipefail
          test -s release-files/android/TeddyBud.v.1.0-Android-arm64.apk
          test -s release-files/desktop/TeddyBud.v.1.0-win-x64.exe
          test -s release-files/desktop/TeddyBud.v.1.0-win-arm64.exe
          test -s release-files/desktop/TeddyBud.v.1.0-mac-arm64.dmg
          test -s release-files/desktop/TeddyBud.v.1.0-mac-x64.dmg
          test -s release-files/desktop/TeddyBud.v.1.0-linux-amd64.deb
          test -s release-files/desktop/TeddyBud.v.1.0-linux-amd64.AppImage
          (
            cd release-files
            find android desktop -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          cat release-files/SHA256SUMS.txt

      - name: Publish or refresh version 1.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v1.0.0
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-files/android release-files/desktop -maxdepth 1 -type f | sort)
          assets+=("release-files/SHA256SUMS.txt")
          cat > release-notes.md <<'EOF'
          # Teddy Bud 1.0

          Verified Android ARM64 and desktop installers for Windows x64/ARM64, macOS Apple Silicon/Intel, and Linux x64.

          These are development builds. Windows signing status is not verified; macOS packages are not signed or notarized. Review operating-system security prompts before installing.

          Verify downloaded package hashes with the attached SHA-256 manifest.
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" --title "Teddy Bud 1.0" --notes-file release-notes.md --latest
          fi
