name = "teddy-bud-browser-gateway"
main = "src/index.mjs"
compatibility_date = "2026-10-12"

[vars]
AUTH_REDIRECT_ORIGINS = "https://teddybud.vercel.app,http://localhost:5173,http://127.0.0.1:5173"

[[kv_namespaces]]
binding = "DEVICE_KEYS"
id = "b321b1407bec4816917e38b967abcced"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "GatewayStateStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GatewayStateStore"]

[secrets]
required = [
  "OPENROUTER_API_KEY",
  "JWT_SIGNING_SECRET",
  "RECOVERY_KEY_SECRET",
  "SUPABASE_URL",
  "SUPABASE_ANON_KEY",
  "SUPABASE_SERVICE_ROLE_KEY",
]
